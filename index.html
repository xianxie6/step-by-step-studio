<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一间可以转来转去的 3D 画室：看素描、水粉、油画一步步画出来，再自己动手画一张。">
<title>一步一步画室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* 布局：全屏 3D 画室，左侧步骤卡，右侧控制台；手机上 3D 在上、卡片在下 */
:root{
  --ink:#16120f;          /* 夜里的画室 */
  --panel:rgba(28,23,19,.84);
  --panel-2:rgba(255,240,220,.06);
  --line:rgba(255,236,210,.11);
  --fg:#f2eadf;
  --mute:#a99d8c;
  --accent:#e8a63f;       /* 土黄 */
  --accent-ink:#2b1c05;
  --paper:#f3efe6;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#gl{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:99px;background:rgba(22,18,15,.72);border:1px solid var(--line);font-size:12px;white-space:nowrap;color:var(--mute);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .3s}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mute)}
.tag.on{color:var(--fg);border-color:rgba(232,166,63,.5)}
.tag.on::before{background:var(--accent);box-shadow:0 0 0 4px rgba(232,166,63,.18)}

/* 画布视图 */
#sheet{position:absolute;inset:16px 416px 16px 376px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#sheet[hidden]{display:none!important}
#sheetBg{position:absolute;inset:0;background:rgba(16,12,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.paperbox{position:relative;height:100%;max-width:100%;aspect-ratio:4/5;pointer-events:auto;box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 10px #2a211a,0 0 0 11px rgba(255,236,210,.12)}
.paperbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#guide{opacity:.28;mix-blend-mode:multiply;pointer-events:none}
#view2d.painting{cursor:none}
#tool2d{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3;will-change:transform}
#tool2d .sh,#tool2d .bd{position:absolute;left:0;bottom:0;transform-origin:50% 100%}
#tool2d .sh{border-radius:40% 40% 50% 50%/10% 10% 4% 4%;background:linear-gradient(to top,rgba(40,28,15,.55),rgba(40,28,15,.08));filter:blur(3px)}
#tool2d .bd svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}

/* 面板 */
.ui{position:absolute;inset:0;pointer-events:none}
.ui>*{pointer-events:auto}
.left{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;width:344px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 32px);overflow:auto;scrollbar-width:none}
.left::-webkit-scrollbar{display:none}
.right{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;width:384px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{padding:4px 2px 2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--mute)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:900;font-size:44px;line-height:1.08;color:var(--accent);letter-spacing:.04em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.brand .sub{font-size:13px;color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:9px 12px}
.stat .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute)}
.stat .v{font-family:var(--mono);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.stat .v b{font-size:22px;color:var(--accent);font-weight:700}
.stepcard{padding:14px 16px 14px}
.step-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700}
#stepText{margin:8px 0 0;font-size:14.5px;line-height:1.75}
#stepText b{color:var(--accent);font-weight:700}
.tip{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.65;color:var(--mute)}
.tip span{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute);opacity:.45;transition:opacity .4s,border-color .4s}
.chip i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.chip.got{opacity:1;color:var(--fg)}
.chip.new{border-color:var(--accent);animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.refcard{overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mute)}
.card-head b{color:var(--fg);font-weight:700}
.refview{position:relative;aspect-ratio:4/3;background:#0e0b09}
#refgl{display:block;width:100%;height:100%}
#refLabels{position:absolute;inset:0;pointer-events:none}
.ann{position:absolute;transform:translate(-50%,-120%);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.ann.alt{background:#8fb3e0;color:#0f1a2b}

.panel{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mute)}
.seg{display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--panel-2)}
.seg button{flex:1;padding:8px 6px;white-space:nowrap;border-radius:8px;font-size:13.5px;color:var(--mute);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--paper);color:#241a10;font-weight:700}
.nav{display:flex;align-items:center;gap:10px}
.ib{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);transition:background .2s}
.ib:hover{background:rgba(255,240,220,.12)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.play{background:rgba(232,166,63,.16);border-color:rgba(232,166,63,.4);color:var(--accent)}
.ib[aria-pressed="true"]{background:rgba(232,166,63,.2);color:var(--accent);border-color:rgba(232,166,63,.45)}
.nav-mid{flex:1;min-width:0}
#navTitle{font-family:var(--display);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#navSub{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;justify-content:space-between;padding:0 3px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.ticks button{width:18px;text-align:center;padding:2px 0;border-radius:4px;color:var(--mute)}
.ticks button.done{color:var(--fg)}
.ticks button.cur{color:var(--accent-ink);background:var(--accent);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.row{display:flex;align-items:center;gap:8px}
.row .seg{flex:1}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px}
.cta svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta:hover{filter:brightness(1.06)}

/* 自己画 工具条 */
#paintbar{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
#paintbar[hidden]{display:none!important}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{min-width:40px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--mono);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:rgba(232,166,63,.18);color:var(--accent)}
.tool.sw{padding:0;width:34px;min-width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.14)}
.tool.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.vsep{width:1px;height:28px;background:var(--line)}
.size{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.size input{width:90px}
.pbtn{height:40px;padding:0 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
.pbtn.done{background:var(--paper);color:#241a10;font-weight:700}

#help{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,6,.6);z-index:20;padding:16px}
#help[hidden]{display:none!important}
#help .card{max-width:420px;padding:20px 22px;line-height:1.8;font-size:14px}
#help h2{margin:0 0 8px;font-family:var(--display);font-size:22px;color:var(--accent)}
#help kbd{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2)}
#help ul{margin:0;padding-left:18px}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:8px 14px;border-radius:99px;background:var(--paper);color:#241a10;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}

@media (max-width:1180px) and (min-width:761px){
  #sheet{inset:300px 16px 16px 376px}
}
@media (max-width:760px){
  body{overflow:hidden}
  #stage{bottom:auto;height:50%}
  h1{font-size:30px}
  .ui{position:absolute;top:50%;bottom:0;left:0;right:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .left,.right{position:static;width:auto;max-height:none;overflow:visible}
  .left{display:contents}
  .right{order:2}
  .brand{order:1;position:absolute;top:calc(-50vh + 12px);top:calc(-100% + 12px);display:none}
  .stats{order:3}
  .stepcard{order:4}
  .refcard{order:5}
  #sheet{inset:8px}
  .paperbox{height:100%}
  #paintbar{position:fixed;bottom:max(10px,env(safe-area-inset-bottom,0px))}
  body.painting .ui{padding-bottom:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="gl" aria-label="3D 画室，可拖动旋转"></canvas>
    <div id="labels"></div>
    <div id="sheet" hidden>
      <div id="sheetBg"></div>
      <div class="paperbox">
        <canvas id="view2d" width="800" height="1000" aria-label="画纸"></canvas>
        <canvas id="guide" width="800" height="1000" hidden></canvas>
        <div id="tool2d" hidden><div class="sh"></div><div class="bd"></div></div>
      </div>
    </div>
  </div>

  <div class="ui">
    <section class="left">
      <header class="brand">
        <div class="eyebrow">一步一步 · 画室</div>
        <h1 id="pieceTitle">石膏球体</h1>
        <div class="sub" id="pieceSub">素描 · 光从左上方来</div>
      </header>
      <div class="stats">
        <div class="stat card"><span class="k">步骤</span><span class="v"><b id="stStep">1</b> /<span id="stStepN">9</span></span></div>
        <div class="stat card"><span class="k" id="stK2">调子</span><span class="v"><b id="st2">0</b> /<span id="st2N">5</span></span></div>
        <div class="stat card"><span class="k">笔触</span><span class="v"><b id="st3">0</b></span></div>
      </div>
      <article class="card stepcard" aria-live="polite">
        <div class="step-eyebrow" id="stepEyebrow">第 1 步 · 定位构图</div>
        <p id="stepText"></p>
        <div class="chips" id="chips"></div>
        <p class="tip" id="stepTip"></p>
      </article>
      <article class="card refcard">
        <div class="card-head"><span>写生视角 · <b id="refTitle">看懂光</b></span><span id="refHint">从画家的位置看静物</span></div>
        <div class="refview"><canvas id="refgl"></canvas><div id="refLabels"></div></div>
      </article>
    </section>

    <section class="right card panel">
      <div>
        <div class="lbl" style="margin-bottom:6px">作品</div>
        <div class="seg" id="pieceSeg">
          <button type="button" id="pSketch" data-piece="sketch" aria-pressed="true">素描 · 石膏球</button>
          <button type="button" id="pGouache" data-piece="gouache" aria-pressed="false">水粉 · 苹果</button>
          <button type="button" id="pOil" data-piece="oil" aria-pressed="false">油画 · 瓷瓶</button>
        </div>
      </div>
      <div class="nav">
        <button class="ib" id="prev" type="button" aria-label="上一步"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="nav-mid"><div id="navTitle">定位构图</div><div id="navSub">第 1 步 · 2H 铅笔</div></div>
        <button class="ib play" id="play" type="button" aria-label="自动播放"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg></button>
        <button class="ib" id="next" type="button" aria-label="下一步"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:6px">作画进程</div>
        <div class="ticks" id="ticks"></div>
        <input type="range" id="slider" min="0" max="9" step="1" value="1" aria-label="拖动查看每一步">
      </div>
      <div class="row">
        <div class="seg" id="viewSeg">
          <button type="button" id="vRoom" data-view="room" aria-pressed="true">画室</button>
          <button type="button" id="vSheet" data-view="sheet" aria-pressed="false">画纸</button>
        </div>
        <button class="ib" id="orbit" type="button" aria-label="自动环绕" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12a9 4 0 1 0 18 0 9 4 0 1 0-18 0"/><path d="M17 8.5l2.6.8-.6 2.6"/></svg></button>
        <button class="ib" id="resetCam" type="button" aria-label="重置视角"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5"/></svg></button>
        <button class="ib" id="helpBtn" type="button" aria-label="操作说明"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8M12 17.2v.1"/></svg></button>
      </div>
      <button class="cta" id="paintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><span id="paintBtnText">自己动手画一张</span></button>
    </section>

    <div id="paintbar" class="card" hidden>
      <div class="tools" id="tools"></div>
      <div class="vsep"></div>
      <label class="size" for="bsize">粗细<input type="range" id="bsize" min="1" max="10" value="4"></label>
      <button class="pbtn" id="guideBtn" type="button" aria-pressed="false">临摹参考</button>
      <button class="pbtn" id="undoBtn" type="button">撤销</button>
      <button class="pbtn" id="newBtn" type="button">换张新纸</button>
      <button class="pbtn done" id="exitPaint" type="button">完成</button>
    </div>
  </div>

  <div id="help" hidden>
    <div class="card">
      <h2>怎么玩</h2>
      <ul>
        <li>拖动画室旋转，滚轮或双指缩放。</li>
        <li><kbd>←</kbd> <kbd>→</kbd> 上一步 / 下一步，<kbd>空格</kbd> 自动播放。</li>
        <li>拖动“作画进程”滑块，随时跳到任意一步。</li>
        <li>“画纸”视图把画面放大，能看清每一根排线和笔触。</li>
        <li>“自己动手画一张”：选铅笔或颜色，直接在画纸上画；在画室视图里也能直接画在画架上。打开“临摹参考”会叠一层淡淡的成品图。</li>
      </ul>
      <p style="margin:12px 0 0;text-align:right"><button class="pbtn done" id="helpClose" type="button">知道了</button></p>
    </div>
  </div>
  <div id="toast" role="status"></div>
</div>

</script>

/* ================= 作品三：油画 · 青花瓷瓶与柠檬 ================= */
function defOil() {
  const VX = 350, VT = 250, VH = 390, TE = 560, LCX = 578, LCY = 668, LRX = 96, LRY = 58;
  const L = n3([-.6, -.62, .45]), Hn = n3([L[0], L[1], L[2] + 1]), B = n3([.3, .85, .3]);
  const rv = t => 46 + 104 * sm(.2, .58, t) - 60 * sm(.7, 1, t) + 12 * Math.exp(-(((t - .01) / .03) ** 2));
  const vase0 = (x, y) => {
    const t = (y - VT) / VH, tc = clamp(t, 0, 1), r = rv(tc), dx = x - VX;
    const a = clamp((r - Math.abs(dx)) / 1.5 + .5, 0, 1) * clamp(t * VH / 1.5 + .5, 0, 1) * clamp((1 - t) * VH / 1.5 + .5, 0, 1);
    const nx = clamp(dx / r, -.999, .999), nz = Math.sqrt(1 - nx * nx), dr = (rv(clamp(tc + .005, 0, 1)) - rv(clamp(tc - .005, 0, 1))) / (.01 * VH);
    const n = n3([nx, -dr, nz]);
    return { a, t: tc, nx, d: dot3(n, L), hl: dot3(n, Hn), rf: dot3(n, B) };
  };
  const lemon0 = (x, y) => {
    const dx = (x - LCX) / LRX, dy = (y - LCY) / LRY, q = dx * dx + dy * dy, a = clamp((1 - Math.sqrt(q)) * LRY / 1.5 + .5, 0, 1);
    const k = q > .998 ? Math.sqrt(.998 / q) : 1, n = n3([dx * k * .8, dy * k, Math.sqrt(Math.max(0, 1 - q * k * k))]);
    return { a, d: dot3(n, L), hl: dot3(n, Hn), rf: dot3(n, B) };
  };
  // 蒙版都在同一批半分辨率格点上取样，缓存起来，避免每张蒙版重复算一遍形体
  const Q = 4, FW = W / Q, FH = H / Q;
  const field = (f, keys) => {
    let arr = null; const sc = {}, nk = keys.length;
